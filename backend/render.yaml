# Blueprint Render. Les valeurs secrètes ne sont jamais écrites ici : sync: false => à saisir dans le tableau de bord Render.
services:
  - type: web
    name: nze-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    # Les migrations sont appliquées avant chaque démarrage (idempotent). Un seul service : pas de course entre instances.
    startCommand: npm run db:migrate && node --experimental-strip-types src/server.ts
    healthCheckPath: /sante
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # À PASSER À « production » AU LANCEMENT (voir docs/LANCEMENT.md). En production, l'API refuse de démarrer sans les clés réelles.
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ENV
        value: test
      - key: OTP_PROVIDER
        value: console
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MYPVIT_BASE_URL
        value: https://api.mypvit.pro
      - key: MYPVIT_OPERATION_ACCOUNT_CODE
        sync: false
      - key: MYPVIT_PASSWORD
        sync: false
      - key: MYPVIT_AGENT
        sync: false
      - key: MYPVIT_PRODUCT
        sync: false
      - key: MYPVIT_CALLBACK_URL_CODE
        sync: false
      - key: MYPVIT_CODE_SECRET
        sync: false
      - key: MYPVIT_CODE_PAYMENT
        sync: false
      - key: MYPVIT_CODE_LINK
        sync: false
      - key: MYPVIT_CODE_STATUS
        sync: false
      - key: MYPVIT_CODE_FEES
        sync: false
      - key: MYPVIT_CODE_COUNTRIES
        sync: false
      - key: MYPVIT_CODE_OPERATORS
        sync: false
      - key: MYPVIT_CODE_QRCODE
        sync: false
      - key: MYPVIT_CODE_BALANCE
        sync: false
      - key: MYPVIT_REDIRECT_SUCCESS_CODE
        sync: false
      - key: MYPVIT_REDIRECT_FAILURE_CODE
        sync: false
      # Cartographie (décision 18) : Google Distance Matrix côté serveur. La clé est saisie dans le tableau de bord Render.
      - key: CARTOGRAPHIE
        value: google
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  # Relances automatiques des échéances : tous les jours à 08:00 UTC (09:00 au Gabon).
  # Ce service Cron Render est facturé à l'utilisation (minimum 1 USD/mois).
  - type: cron
    name: nze-relances-quotidiennes
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    schedule: "0 8 * * *"
    buildCommand: npm ci
    startCommand: npm run job:relances
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false

  # Alerte des dossiers de réclamation dont le délai est dépassé : toutes les heures, à la minute 0.
  # Ce service Cron Render est facturé à l'utilisation (minimum 1 USD/mois), comme le job des relances : à valider avec le fondateur.
  - type: cron
    name: nze-alertes-retards
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: npm run job:alertes-retards
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false

  # Notifications push restées en attente. Sans FIREBASE_SERVICE_ACCOUNT_JSON, le job n'envoie rien. Coût Render à valider avec le fondateur.
  - type: cron
    name: nze-push-notifications
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    schedule: "*/2 * * * *"
    buildCommand: npm ci
    startCommand: npm run job:push-notifications
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # Rattrapage des paiements restés en attente. Coût Render à valider avec le fondateur (facturation à l'usage).
  - type: cron
    name: nze-rattrapage-paiements
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    schedule: "*/10 * * * *"
    buildCommand: npm ci
    startCommand: npm run job:rattrapage-paiements
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
      - key: MYPVIT_OPERATION_ACCOUNT_CODE
        sync: false
      - key: MYPVIT_OPERATION_ACCOUNT_CODE_AIRTEL
        sync: false
      - key: MYPVIT_OPERATION_ACCOUNT_CODE_MOOV
        sync: false
      - key: MYPVIT_OPERATION_ACCOUNT_CODE_CARD
        sync: false
      - key: MYPVIT_PASSWORD
        sync: false
      - key: MYPVIT_AGENT
        sync: false
      - key: MYPVIT_PRODUCT
        sync: false
      - key: MYPVIT_CALLBACK_URL_CODE
        sync: false
      - key: MYPVIT_RECEPTION_URL_CODE
        sync: false
      - key: MYPVIT_WEBHOOK_ALLOWED_IPS
        sync: false
      - key: MYPVIT_BASE_URL
        sync: false
      - key: MYPVIT_TIMEOUT_MS
        sync: false
      - key: MYPVIT_CODE_SECRET
        sync: false
      - key: MYPVIT_CODE_PAYMENT
        sync: false
      - key: MYPVIT_CODE_LINK
        sync: false
      - key: MYPVIT_CODE_STATUS
        sync: false
      - key: MYPVIT_CODE_FEES
        sync: false
      - key: MYPVIT_CODE_COUNTRIES
        sync: false
      - key: MYPVIT_CODE_OPERATORS
        sync: false
      - key: MYPVIT_CODE_QRCODE
        sync: false
      - key: MYPVIT_CODE_BALANCE
        sync: false
